name: create release artifacts
description: Create release artifacts for the contrast project

inputs:
  image_tag:
    description: >
      Tag to push the container images under. Nightlies pass their date-suffixed version so they don't move the tag of an already published release.
    required: false
    default: ''
  container_registry:
    description: Container registry to push the images to
    required: true
  s3-bucket-path:
    description: S3 bucket path to upload the artifacts
    required: false

outputs:
  paths:
    description: Artifact paths
    value: ${{ steps.artifact-paths.outputs.paths }}
  s3-bucket-url:
    description: URL of the S3 bucket where the artifacts were uploaded
    value: ${{ steps.upload-artifacts.outputs.url }}

runs:
  using: "composite"
  steps:
    - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
    - name: Create justfile.env
      shell: bash
      env:
        CONTAINER_REGISTRY: ${{ inputs.container_registry }}
        SET: base
      run: |
        cat <<EOF > justfile.env
        container_registry=${CONTAINER_REGISTRY}
        set=${SET}
        EOF
    - name: Push containers
      shell: bash
      env:
        CONTRAST_IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        just push-release-images
        mv workspace/just.containerlookup image-replacements.txt
    - name: Upload image replacement file (for main branch PR)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: image-replacements
        path: |
          image-replacements.txt
    - name: Update cli assets
      shell: bash
      run: cp image-replacements.txt cli/cmd/assets/image-replacements.txt
    - name: Expected artifact paths
      id: artifact-paths
      shell: bash
      run: |
        cat << 'EOF' | tee -a "${GITHUB_OUTPUT}"
        paths<<EOM
        workspace/contrast-x86_64-linux
        workspace/coordinator*.yml
        workspace/runtime-*.yml
        workspace/emojivoto-demo.yml
        workspace/mysql-demo.yml
        workspace/vault-demo.yml
        workspace/node-installer-target-config-k3s.yml
        workspace/node-installer-target-config-rke2.yml
        workspace/*.cdx.json
        EOM
        EOF
    - name: Create coordinator resource definitions
      shell: bash
      env:
        SET: base
      run: |
        set -u
        mkdir -p workspace

        nix shell ".#${SET}.contrast.resourcegen" --command resourcegen \
          --image-replacements "./image-replacements.txt" \
          --add-load-balancers \
          coordinator > "workspace/coordinator.yml"
    - name: Create runtime resource definitions
      shell: bash
      env:
        SET: base
      run: |
        set -u
        platforms=(
          "metal-qemu-snp-gpu"
          "metal-qemu-snp"
          "metal-qemu-tdx"
          "metal-qemu-tdx-gpu"
        )
        for platform in "${platforms[@]}"; do
          nix shell ".#${SET}.contrast.resourcegen" --command resourcegen \
            --image-replacements ./image-replacements.txt \
            --namespace contrast-system \
            --add-namespace-object \
            --platform "$platform" \
            runtime > "workspace/runtime-$platform.yml"
        done
    - name: Create demo resource definitions
      shell: bash
      env:
        SET: base
      run: |
        set -u
        nix shell ".#${SET}.contrast.resourcegen" --command resourcegen \
          --image-replacements ./image-replacements.txt \
          --add-load-balancers emojivoto-sm-ingress > workspace/emojivoto-demo.yml
        nix shell ".#${SET}.contrast.resourcegen" --command resourcegen \
          --image-replacements ./image-replacements.txt \
          --add-load-balancers mysql > workspace/mysql-demo.yml
        nix shell ".#${SET}.contrast.resourcegen" --command resourcegen \
          --image-replacements ./image-replacements.txt \
          --add-load-balancers vault > workspace/vault-demo.yml
    - name: Create node installer target configs
      shell: bash
      env:
        SET: base
      run: |
        set -u
        distros=(
          k3s
          rke2
        )
        for distro in "${distros[@]}"; do
          nix shell ".#${SET}.contrast.resourcegen" --command resourcegen \
            --node-installer-target-conf-type "${distro}" \
            --namespace contrast-system \
            --add-namespace-object \
            node-installer-target-conf > "workspace/node-installer-target-config-${distro}.yml"
        done
    - name: Create category SBOMs
      shell: bash
      env:
        SET: base
      run: |
        set -euo pipefail
        mkdir -p workspace
        for category in cli runtimeConfidential runtimeNonConfidential; do
          sbom=$(nix run ".#${SET}.scripts.finalize-sbom" -- "$category")
          id=$(jq -r '.metadata.component.name' <<<"$sbom")
          printf '%s\n' "$sbom" > "workspace/${id}.cdx.json"
        done
    - uses: ./.github/actions/build_cli
      with:
        system: x86_64-linux
        sbom-path: workspace/contrast-cli.cdx.json
    - id: upload-artifacts
      uses: ./.github/actions/s3_upload
      if: ${{ inputs.s3-bucket-path != '' }}
      with:
        files: ${{ steps.artifact-paths.outputs.paths }}
        s3-bucket-path: ${{ inputs.s3-bucket-path }}/${{ github.run_id }}/${{ github.run_attempt }}
