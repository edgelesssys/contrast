name: build CLI
description: Build the Contrast CLI release binary for a given system

inputs:
  system:
    description: Nix system (e.g. x86_64-linux, aarch64-darwin)
    required: true
  sbom-path:
    description: Path to the CLI SBOM to validate, if provided
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Build CLI
      shell: bash
      env:
        SET: base
        SYSTEM: ${{ inputs.system }}
      run: |
        mkdir -p workspace
        nix build -L ".#${SET}.contrast.cli-release"
        cp result/bin/contrast "workspace/contrast-${SYSTEM}"
    - name: Verify CLI SBOM
      if: ${{ inputs.sbom-path != '' }}
      shell: bash
      env:
        SBOM_PATH: ${{ inputs.sbom-path }}
      run: |
        cli=$(cd result && pwd -P)
        hash=$(nix-hash --type sha256 "$cli")
        jq -e --arg ref "${cli##*/}" --arg hash "$hash" '
          .components | any(
            .["bom-ref"] == $ref and
            any(.hashes[]?; .alg == "SHA-256" and .content == $hash)
          )
        ' "$SBOM_PATH" > /dev/null
