name: build CLI
description: Build the Contrast CLI release binary and its SBOM for a given system

inputs:
  system:
    description: Nix system (e.g. x86_64-linux, aarch64-darwin)
    required: true

runs:
  using: "composite"
  steps:
    - name: Build CLI
      shell: bash
      env:
        SET: base
        SYSTEM: ${{ inputs.system }}
      run: |
        mkdir -p workspace
        nix build -L ".#${SET}.contrast.cli-release"
        cp result/bin/contrast "workspace/contrast-${SYSTEM}"
    - name: Create and verify CLI SBOM
      shell: bash
      env:
        SET: base
        SYSTEM: ${{ inputs.system }}
      run: |
        set -euo pipefail
        sbom=$(nix run ".#${SET}.scripts.finalize-sbom" -- cli --artifact "workspace/contrast-${SYSTEM}")

        name=$(jq -r '.metadata.component.name' <<<"$sbom")
        if [[ $name != "contrast-cli-${SYSTEM}" ]]; then
          echo "SBOM identifies itself as '${name}', expected 'contrast-cli-${SYSTEM}'" >&2
          exit 1
        fi
        printf '%s\n' "$sbom" > "workspace/${name}.cdx.json"

        # The SBOM has to describe the Nix output we just built, not some other one.
        cli=$(cd result && pwd -P)
        hash=$(nix-hash --type sha256 "$cli")
        jq -e --arg ref "${cli##*/}" --arg hash "sha256:$hash" '
          .components | any(
            .["bom-ref"] == $ref and
            any(.properties[]?; .name == "nix:narinfo:nar_hash" and .value == $hash)
          )
        ' "workspace/${name}.cdx.json" > /dev/null
