name: static checks
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
jobs:
  flake-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_nix
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cachixToken: ""
      - name: nix flake check
        run: |
          nix -L flake check
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SET: base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup_nix
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cachixToken: ""
      - name: Run code generations & tidying
        run: |
          nix run ".#${SET}.scripts.generate"
      - name: Collect generated changes
        run: |
          git diff --binary HEAD > "$RUNNER_TEMP/generated.patch"
      - name: Upload generated changes
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && startsWith(github.head_ref, 'renovate/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-changes
          path: ${{ runner.temp }}/generated.patch
          retention-days: 1
      - name: Check generated changes
        run: |
          git diff --exit-code
  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SET: base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_nix
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cachixToken: ""
      - name: Run govulncheck
        run: |
          nix run ".#${SET}.scripts.govulncheck"
  govulncheck-autofix:
    name: Prepare vulnerability fixes
    needs: govulncheck
    if: ${{ failure() && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: govulncheck-autofix
      cancel-in-progress: false
    outputs:
      status: ${{ steps.fix.outputs.status }}
    env:
      SET: base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check for an existing autofix PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh pr list --head automated/govulncheck --state open --json number --jq '.[0].number // empty')
          echo "number=${number}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup_nix
        if: steps.existing.outputs.number == ''
        with:
          githubToken: ${{ github.token }}
      - name: Apply the mechanical fixes
        id: fix
        if: steps.existing.outputs.number == ''
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/base.sha"
          set +e
          nix run ".#${SET}.scripts.govulncheck-fix" > "$RUNNER_TEMP/report.md"
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Collect fixes
        if: contains(fromJSON('["0", "4"]'), steps.fix.outputs.status)
        run: git diff --binary HEAD > "$RUNNER_TEMP/update.patch"
      - name: Upload fixes
        if: contains(fromJSON('["0", "4"]'), steps.fix.outputs.status)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck-update
          path: |
            ${{ runner.temp }}/update.patch
            ${{ runner.temp }}/base.sha
            ${{ runner.temp }}/report.md
          retention-days: 1

  govulncheck-notify:
    needs: govulncheck-autofix
    if: always() && needs.govulncheck-autofix.outputs.status != '' && needs.govulncheck-autofix.outputs.status != '0'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Notify teams channel
        uses: ./.github/actions/post_to_teams
        with:
          webhook: ${{ secrets.TEAMS_CI_WEBHOOK }}
          title: ${{ needs.govulncheck-autofix.outputs.status == '4' && 'govulncheck found vulnerabilities that cannot be fixed automatically' || 'The govulncheck autofix failed' }}
          message: Check the run summary for details.

  golangci-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
    env:
      SET: base
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_nix
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cachixToken: ""
      - name: Run golangci-lint
        run: |
          nix run ".#${SET}.scripts.golangci-lint"
  go-licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SET: base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_nix
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cachixToken: ""
      - name: Run go-licenses
        run: |
          nix run ".#${SET}.scripts.go-licenses-check"
  sdk-wasm-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_nix
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cachixToken: ""
      - name: Compile SDK for Wasm
        env:
          GOOS: js
          GOARCH: wasm
        run: |
          cat <<EOF > ./main.go
          package main
          import _ "github.com/edgelesssys/contrast/sdk"
          func main() {}
          EOF
          go build -tags contrast_unstable_api -o main.wasm ./main.go
      - name: Check Wasm code size
        run: |
          if [ "$(stat -c%s main.wasm)" -gt 25000000 ]; then
            echo "Compiled SDK exceeds size limit of 25MB"
            exit 1
          fi
  cli-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SET: base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_nix
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cachixToken: ""
      - name: Build CLI
        run: |
          nix build ".#${SET}.contrast.cli"
  darwin-cli-build:
    needs: cli-build
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SET: base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_nix
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cachixToken: ""
      - name: Build darwin formatter
        run: |
          nix build .#formatter.aarch64-darwin
      - name: Build darwin CLI
        run: |
          nix build ".#${SET}.contrast.cli"
  sev-snp-measure-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SET: base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_nix
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cachixToken: ""
      - name: Run sev-snp-measure-consistency
        run: |
          nix run ".#${SET}.scripts.sev-snp-measure-consistency"
  qemu-acpi-blobs-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SET: base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_nix
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cachixToken: ""
      - name: Test QEMU ACPI blobs
        run: |
          nix build -L ".#${SET}.kata.qemu-acpi-blobs-test"
