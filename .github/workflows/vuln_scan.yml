name: vulnerability scan

on:
  schedule:
    - cron: "45 2 * * *" # 02:45 UTC, every day
  workflow_call:
    secrets:
      GITHUB_TOKEN_IN:
        required: false
      CACHIX_AUTH_TOKEN:
        required: true
      TEAMS_CI_WEBHOOK:
        required: false
  workflow_dispatch: {}

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        sbom:
          - cli
          - runtimeConfidential
          - runtimeNonConfidential
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Required to publish findings to the GitHub Security tab.
      security-events: write
    env:
      SET: base
      SBOM: ${{ matrix.sbom }}
      VULNIX_CACHE_DIR: ${{ github.workspace }}/.vulnix-cache
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Restore vulnix NVD cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.vulnix-cache
          key: vulnix-nvd-${{ github.run_id }}-${{ matrix.sbom }}
          restore-keys: vulnix-nvd-
      - uses: ./.github/actions/setup_nix
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN_IN || secrets.GITHUB_TOKEN }}
          cachixToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build SBOM
        id: sbom
        run: |
          path=$(nix build --no-link --print-out-paths ".#${SET}.sbom.${SBOM}")
          echo "path=${path}" >> "$GITHUB_OUTPUT"
      - name: Scan SBOM for known vulnerabilities
        env:
          SBOM_PATH: ${{ steps.sbom.outputs.path }}
        run: |
          nix run ".#${SET}.scripts.vuln-scan" -- \
            "${SBOM_PATH}" \
            "${GITHUB_WORKSPACE}/sarif-${SBOM}"
      - name: Upload results to the Security tab
        # Publish findings even when the scan failed. Guard on SARIF existing.
        if: ${{ !cancelled() && hashFiles(format('sarif-{0}/*.sarif', matrix.sbom)) != '' }}
        uses: github/codeql-action/upload-sarif@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1
        with:
          sarif_file: sarif-${{ matrix.sbom }}
          category: vuln-scan-${{ matrix.sbom }}

  notify:
    name: "Notify about scan failures"
    needs: scan
    if: ${{ failure() && github.event_name == 'schedule' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Notify teams channel
        uses: ./.github/actions/post_to_teams
        with:
          webhook: ${{ secrets.TEAMS_CI_WEBHOOK }}
          title: "Nightly vulnerability scan failed"
          message: "Check the run for details."
          additionalActions: '[{"type": "Action.OpenUrl", "title": "Security tab", "url": "${{ github.server_url }}/${{ github.repository }}/security/code-scanning"}]'
