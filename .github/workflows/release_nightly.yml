name: release nightly

on:
  schedule:
    - cron: "15 20 * * *" # 20:15 UTC, every day
  workflow_dispatch:
    inputs:
      skip_platforms:
        description: Comma or space separated bare metal platforms to skip, e.g. Metal-QEMU-TDX-GPU. Overrides the SKIP_PLATFORMS repository variable.
        type: string
        required: false
        default: ""

env:
  container_registry: ghcr.io/edgelesssys
  DO_NOT_TRACK: 1

# Queue minor and patch runs behind each other. Cancel the in-progress run if a patch release is urgent.
concurrency:
  group: release-nightly
  cancel-in-progress: false

jobs:
  process-inputs:
    name: Process inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      KIND: ${{ steps.kind.outputs.value }}
      EFFECTIVE_VERSION: ${{ steps.nightly-version.outputs.value }}
      WITHOUT_V: ${{ steps.version-info.outputs.without_v }}
      MAJOR_MINOR_PATCH: ${{ steps.version-info.outputs.major_minor_patch }}
      RELEASE_BRANCH: ${{ steps.version-info.outputs.release_branch }}
      WORKING_BRANCH: ${{ steps.branch.outputs.value }}
      SKIP_PLATFORMS: ${{ steps.platforms.outputs.skip_platforms }}
      RELEASE_TEST_PLATFORMS: ${{ steps.platforms.outputs.release_test_platforms }}
      PREVIOUS_TAG: ${{ steps.kind.outputs.value == 'patch' && steps.version-info.outputs.previous_patch_tag || steps.version-info.outputs.previous_minor_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
          fetch-depth: 0
      - name: Get working branch
        id: branch
        run: echo "value=$(git branch --show-current)" >> "$GITHUB_OUTPUT"
      - name: Determine release kind
        id: kind
        env:
          WORKING_BRANCH: ${{ steps.branch.outputs.value }}
        run: |
          if [[ "${WORKING_BRANCH}" == "main" ]]; then
            kind="minor"
          elif [[ "${WORKING_BRANCH}" =~ ^release/v[0-9]+\.[0-9]+$ ]]; then
            kind="patch"
          else
            echo "::error::release nightly must run on main or a release/vX.Y branch, got ${WORKING_BRANCH}."
            exit 1
          fi
          echo "value=${kind}" | tee -a "$GITHUB_OUTPUT"
      - name: Determine nightly version
        id: nightly-version
        env:
          KIND: ${{ steps.kind.outputs.value }}
          WORKING_BRANCH: ${{ steps.branch.outputs.value }}
        run: |
          if [[ "${KIND}" == "minor" ]]; then
            base=$(sed 's/-.*$//' version.txt)
          else
            # version.txt is stale on release branches (nightly promotion never commits version bumps), so derive the next patch from the tags.
            series="${WORKING_BRANCH#release/}"
            latest=$(git tag --list "${series}.*" | sort -V | tail -1)
            if [[ -z "${latest}" ]]; then
              echo "::error::No release tag found for series ${series}."
              exit 1
            fi
            if ! git merge-base --is-ancestor "${latest}" HEAD; then
              echo "::error::Latest tag ${latest} is not an ancestor of ${WORKING_BRANCH}."
              exit 1
            fi
            without_v="${latest#v}"
            base="${without_v%.*}.$((${without_v##*.} + 1))"
          fi
          echo "value=v${base}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Resolve platforms
        id: platforms
        uses: ./.github/actions/release_platforms
        with:
          # Scheduled runs take no inputs, so they read the repository variable.
          skip_platforms: ${{ inputs.skip_platforms || vars.SKIP_PLATFORMS }}
      - name: Parse version
        id: version-info
        uses: ./.github/actions/parse_version
        with:
          version: ${{ steps.nightly-version.outputs.value }}

  cleanup-nightly-drafts:
    name: Clean up old nightly draft releases
    runs-on: ubuntu-24.04
    needs: process-inputs
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Only this run's version is cleaned up!
      - name: Delete existing nightly draft releases for this version
        env:
          GH_REPO: ${{ github.repository }}
          MAJOR_MINOR_PATCH: ${{ needs.process-inputs.outputs.MAJOR_MINOR_PATCH }}
        run: |
          gh release list --repo "${GH_REPO}" --limit 30 --json tagName,isDraft \
            | jq -r '.[] | select(.isDraft == true) | .tagName' \
            | grep -E "^v${MAJOR_MINOR_PATCH//./\\.}-[0-9]{4}-[0-9]{2}-[0-9]{2}$" \
            | while IFS= read -r nightly_version; do
                echo "Deleting nightly draft release: ${nightly_version}"
                gh release delete "${nightly_version}" --repo "${GH_REPO}" --yes
              done

  release-x86_64-linux:
    name: "release-requirement: Build and push artifacts, create nightly draft release"
    runs-on: ubuntu-24.04
    needs: [process-inputs, cleanup-nightly-drafts]
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      LOG_COLLECTOR_IMAGE: ${{ steps.build.outputs.log_collector_image }}
      ARTIFACTS_URL: ${{ steps.build.outputs.s3-bucket-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.process-inputs.outputs.WORKING_BRANCH }}
          persist-credentials: false
      - uses: ./.github/actions/release_build_linux
        id: build
        with:
          effective_version: ${{ needs.process-inputs.outputs.EFFECTIVE_VERSION }}
          without_v: ${{ needs.process-inputs.outputs.WITHOUT_V }}
          working_branch: ${{ needs.process-inputs.outputs.WORKING_BRANCH }}
          container_registry: ${{ env.container_registry }}
          previous_tag: ${{ needs.process-inputs.outputs.PREVIOUS_TAG }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  release-aarch64-darwin:
    name: "release-requirement: Build aarch64-darwin CLI"
    runs-on: macos-latest
    needs: [process-inputs, release-x86_64-linux]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.process-inputs.outputs.WORKING_BRANCH }}
          persist-credentials: false
      - uses: ./.github/actions/release_build_darwin
        with:
          effective_version: ${{ needs.process-inputs.outputs.EFFECTIVE_VERSION }}
          without_v: ${{ needs.process-inputs.outputs.WITHOUT_V }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  report-artifacts:
    name: Pre-release artifacts
    needs: [release-x86_64-linux, release-aarch64-darwin]
    permissions: {}
    uses: ./.github/workflows/report_artifacts.yml
    with:
      url: ${{ needs.release-x86_64-linux.outputs.ARTIFACTS_URL }}

  nightly:
    name: "release-requirement: e2e nightly"
    needs: process-inputs
    uses: ./.github/workflows/e2e_nightly.yml
    with:
      skip-platforms: ${{ needs.process-inputs.outputs.SKIP_PLATFORMS }}
      skip-maintenance: ${{ needs.process-inputs.outputs.KIND == 'patch' }}
    secrets:
      GITHUB_TOKEN_IN: ${{ secrets.GITHUB_TOKEN }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      NUNKI_CI_COMMIT_PUSH_PR: ${{ secrets.NUNKI_CI_COMMIT_PUSH_PR }}
      TEAMS_CI_WEBHOOK: ${{ secrets.TEAMS_CI_WEBHOOK }}
      CONTRAST_GHCR_READ: ${{ secrets.CONTRAST_GHCR_READ }}
    permissions:
      contents: read
      packages: write

  test:
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.process-inputs.outputs.RELEASE_TEST_PLATFORMS) }}
        cli-arch:
          - x86_64-linux
          - aarch64-darwin
      fail-fast: false
    name: "release-requirement: e2e release on ${{ matrix.platform.name }} (${{ matrix.cli-arch }})"
    runs-on: ${{ matrix.cli-arch == 'aarch64-darwin' && 'macos-latest' || matrix.platform.linux-runner }}
    # Serialize matrix entries that share a cluster (linux + darwin) to
    # avoid clashing on coordinator state and resource cleanup.
    concurrency:
      group: e2e-release-${{ matrix.platform.name }}-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      # Needed for GH OIDC -> GCP WIF federation on the darwin entries.
      id-token: write
    needs: [process-inputs, release-x86_64-linux, release-aarch64-darwin, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.process-inputs.outputs.WORKING_BRANCH }}
          persist-credentials: false
      - uses: ./.github/actions/release_e2e_test
        with:
          version: ${{ needs.process-inputs.outputs.EFFECTIVE_VERSION }}
          without_v: ${{ needs.process-inputs.outputs.WITHOUT_V }}
          s3_base_url: ${{ needs.release-x86_64-linux.outputs.ARTIFACTS_URL }}
          container_registry: ${{ env.container_registry }}
          platform_name: ${{ matrix.platform.name }}
          node_installer_target_conf: ${{ matrix.platform.node-installer-target-conf }}
          self_hosted: ${{ matrix.cli-arch == 'x86_64-linux' }}
          cli_arch: ${{ matrix.cli-arch }}
          is_public: ${{ matrix.platform.is-public }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
          sa_email: ${{ vars.GCP_SA_EMAIL }}
          tailscale_client_id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          tailscale_client_secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          log_collector_image: ${{ needs.release-x86_64-linux.outputs.LOG_COLLECTOR_IMAGE }}

  notify-teams:
    name: Notify teams channel of failure
    runs-on: ubuntu-24.04
    # `nightly` is left out: e2e_nightly.yml notifies about its own failures.
    needs: [process-inputs, cleanup-nightly-drafts, release-x86_64-linux, release-aarch64-darwin, test]
    if: always() && github.event_name == 'schedule' && github.run_attempt == 1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect failed jobs
        id: get-json
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"))
            | map({title: .key, value: .value.result})' <<<"${RESULTS}")
          if [[ "$(jq 'length' <<<"${failed}")" -eq 0 ]]; then
            echo "No failures detected, nothing to notify."
            exit 0
          fi
          echo "json=$(jq -c . <<<"${failed}")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/post_to_teams
        if: ${{ steps.get-json.outputs.json != '' }}
        with:
          webhook: ${{ secrets.TEAMS_CI_WEBHOOK }}
          title: "${{ github.workflow }} failed"
          message: "workflow ${{ github.workflow }} failed on ${{ github.ref_name }}"
          additionalFields: "${{ steps.get-json.outputs.json }}"
