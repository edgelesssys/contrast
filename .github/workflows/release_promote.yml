name: release promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to promote (e.g. v1.24.1). Leave empty to promote the latest minor nightly.
        type: string
        required: false
        default: ""
      skip_platforms:
        description: Comma or space separated bare metal platforms that the nightly skipped and that may stay untested in this release, e.g. Metal-QEMU-TDX-GPU.
        type: string
        required: false
        default: ""
      checkout_main_ref:
        description: Checkout this git ref as main branch (some workflows run on this state)
        type: string
        required: false
        default: main

env:
  container_registry: ghcr.io/edgelesssys
  DO_NOT_TRACK: 1

concurrency:
  group: release-promote
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify nightly and prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      KIND: ${{ steps.version-info.outputs.part_patch != '0' && 'patch' || 'minor' }}
      EFFECTIVE_VERSION: ${{ steps.effective-version.outputs.value }}
      WITHOUT_V: ${{ steps.version-info.outputs.without_v }}
      MAJOR_MINOR: ${{ steps.version-info.outputs.major_minor }}
      MAJOR_MINOR_PATCH: ${{ steps.version-info.outputs.major_minor_patch }}
      RELEASE_BRANCH: ${{ steps.version-info.outputs.release_branch }}
      NEXT_MINOR: ${{ steps.version-info.outputs.next_minor }}
      NEXT_MINOR_PRE_WITHOUT_V: ${{ steps.version-info.outputs.next_minor_pre_without_v }}
      PREVIOUS_TAG: ${{ steps.version-info.outputs.part_patch != '0' && steps.version-info.outputs.previous_patch_tag || steps.version-info.outputs.previous_minor_tag }}
      nightly_ref: ${{ steps.nightly-info.outputs.nightly_ref }}
      nightly_version: ${{ steps.effective-version.outputs.nightly_version }}
      nightly_run_id: ${{ steps.nightly-info.outputs.nightly_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve target branch
        id: target
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "${INPUT_VERSION}" ]]; then
            echo "branch=main" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "${INPUT_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be in the form of vX.Y.Z, got ${INPUT_VERSION}."
            exit 1
          fi
          if [[ "${INPUT_VERSION##*.}" == "0" ]]; then
            echo "branch=main" | tee -a "$GITHUB_OUTPUT"
          else
            echo "branch=release/${INPUT_VERSION%.*}" | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Get nightly run info
        id: nightly-info
        env:
          GH_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          nightly_run_id=$(gh run list --repo "${GH_REPO}" --workflow=release_nightly.yml --branch "${TARGET_BRANCH}" --status=completed --limit 1 --json databaseId --jq '.[0].databaseId')
          if [[ -z "${nightly_run_id}" ]]; then
            echo "::error::No completed run of release_nightly.yml found on ${TARGET_BRANCH}."
            exit 1
          fi
          nightly_ref=$(gh run view "${nightly_run_id}" --repo "${GH_REPO}" --json headSha --jq '.headSha')
          nightly_date=$(gh run view "${nightly_run_id}" --repo "${GH_REPO}" --json createdAt --jq '.createdAt | .[0:10]')
          echo "nightly_run_id=${nightly_run_id}" | tee -a "$GITHUB_OUTPUT"
          echo "nightly_ref=${nightly_ref}" | tee -a "$GITHUB_OUTPUT"
          echo "nightly_date=${nightly_date}" | tee -a "$GITHUB_OUTPUT"
      - name: Determine version
        id: effective-version
        env:
          GH_REPO: ${{ github.repository }}
          NIGHTLY_REF: ${{ steps.nightly-info.outputs.nightly_ref }}
          NIGHTLY_DATE: ${{ steps.nightly-info.outputs.nightly_date }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            FULL_VERSION="${INPUT_VERSION}"
          else
            version_txt=$(gh api -H "Accept: application/vnd.github.raw" "repos/${GH_REPO}/contents/version.txt?ref=${NIGHTLY_REF}")
            base="${version_txt%%-*}"
            FULL_VERSION="v${base}"
          fi
          echo "FULL_VERSION=${FULL_VERSION}" | tee -a "$GITHUB_ENV"
          echo "value=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "nightly_version=${FULL_VERSION}-${NIGHTLY_DATE}" >> "$GITHUB_OUTPUT"
      - name: Resolve platforms
        id: platforms
        uses: ./.github/actions/skip_platforms
        with:
          skip_platforms: ${{ inputs.skip_platforms }}
      - name: Verify nightly tests passed
        env:
          SKIP_PLATFORMS: ${{ steps.platforms.outputs.skip_platforms }}
          NIGHTLY_RUN_ID: ${{ steps.nightly-info.outputs.nightly_run_id }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_requirement_jobs=$(gh api --paginate \
            "repos/${GH_REPO}/actions/runs/${NIGHTLY_RUN_ID}/jobs?per_page=30" \
            --jq '.jobs[] | select(.name | startswith("release-requirement: ")) | {name, conclusion}')
          # Every release-requirement job must be present, so a rename can't
          # silently drop one from the gate. Matrix and reusable-workflow jobs
          # are matched by name prefix. Keep in sync with release_nightly.yml.
          expected=(
            "release-requirement: Build and push artifacts, create nightly draft release"
            "release-requirement: Build aarch64-darwin CLI"
            "release-requirement: e2e nightly / Metal-QEMU-SNP "
            "release-requirement: e2e nightly / Metal-QEMU-TDX "
            "release-requirement: e2e nightly / Metal-QEMU-SNP-GPU "
            "release-requirement: e2e nightly / Metal-QEMU-TDX-GPU "
            "release-requirement: e2e release on "
          )
          # A platform skipped on purpose has no nightly jobs, or only skipped ones.
          mapfile -t skipped < <(jq -r '.[] | "release-requirement: e2e nightly / \(.) "' <<<"${SKIP_PLATFORMS}")
          for prefix in "${skipped[@]}"; do
            for i in "${!expected[@]}"; do
              [[ "${expected[i]}" == "${prefix}" ]] && unset 'expected[i]'
            done
          done
          expected=("${expected[@]}")
          missing=()
          for prefix in "${expected[@]}"; do
            if ! jq -e -s --arg p "${prefix}" 'any(.[]; .name | startswith($p))' <<<"${release_requirement_jobs}" >/dev/null; then
              missing+=("${prefix}")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Expected release-requirement job(s) missing from nightly run ${NIGHTLY_RUN_ID}; renamed or removed? Update release_nightly.yml or this list:"
            printf '%s\n' "${missing[@]}"
            exit 1
          fi
          prefixes=$(printf '%s\n' "${expected[@]}" | jq -R . | jq -s .)
          required_jobs=$(jq -s --argjson prefixes "${prefixes}" \
            '[.[] | select(.name as $n | $prefixes | any(. as $p | $n | startswith($p)))]' \
            <<<"${release_requirement_jobs}")
          failed=$(jq -r '.[] | select(.conclusion != "success") | "\(.name): \(.conclusion)"' <<<"${required_jobs}")
          if [[ -n "${failed}" ]]; then
            echo "::error::The following required jobs did not succeed in nightly run ${NIGHTLY_RUN_ID}:"
            echo "${failed}"
            exit 1
          fi
          required=$(jq 'length' <<<"${required_jobs}")
          echo "All ${required} release-requirement job(s) passed in nightly run ${NIGHTLY_RUN_ID}."
      - name: Verify nightly draft release has artifacts
        env:
          NIGHTLY_VERSION: ${{ steps.effective-version.outputs.nightly_version }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset_count=$(gh release view "${NIGHTLY_VERSION}" --repo "${GH_REPO}" --json assets --jq '.assets | length' 2>/dev/null || echo "0")
          if [[ "${asset_count}" -eq 0 ]]; then
            echo "::error::No assets found on nightly draft release ${NIGHTLY_VERSION}. Expected artifacts from the build."
            exit 1
          fi
          echo "Found ${asset_count} assets on ${NIGHTLY_VERSION}."
      - name: Don't overwrite published releases
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          is_draft=$(gh release view "${FULL_VERSION}" --repo "${GH_REPO}" --json isDraft -q .isDraft 2>/dev/null || true)
          if [[ "${is_draft}" == "false" ]]; then
            echo "::error::Release ${FULL_VERSION} is already published."
            exit 1
          fi
      - name: Parse version
        id: version-info
        uses: ./.github/actions/parse_version
        with:
          version: ${{ steps.effective-version.outputs.value }}
      - name: Verify nightly ref is the release branch head
        if: steps.version-info.outputs.part_patch != '0'
        env:
          GH_REPO: ${{ github.repository }}
          REF: ${{ steps.nightly-info.outputs.nightly_ref }}
          RELEASE_BRANCH: ${{ steps.version-info.outputs.release_branch }}
        run: |
          branch_uri=$(jq -rn --arg branch "${RELEASE_BRANCH}" '$branch | @uri')
          status=$(gh api "repos/${GH_REPO}/compare/${REF}...${branch_uri}" --jq '.status')
          if [[ "${status}" == "identical" ]]; then
            exit 0
          fi
          # A rerun finds the branch past the nightly ref, on the release commit a previous attempt pushed.
          if [[ "${status}" == "ahead" ]] && gh api "repos/${GH_REPO}/git/ref/tags/${FULL_VERSION}" > /dev/null; then
            exit 0
          fi
          # The release commit goes on top of the nightly ref, and release/* requires linear history.
          echo "::error::${RELEASE_BRANCH} has moved past nightly ref ${REF} (compare status: ${status}). Cut a new nightly."
          exit 1
      - name: Checkout nightly ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.nightly-info.outputs.nightly_ref }}
          path: nightly
          persist-credentials: false
      - name: Bump Go module versions to release version
        if: hashFiles('nightly/sdk/go.mod') != ''
        uses: ./.github/actions/bump_version
        with:
          version: ${{ steps.version-info.outputs.without_v }}
          working-directory: nightly
          commit: false
      - name: Verify Go module versions of nightly ref
        if: hashFiles('nightly/sdk/go.mod') != ''
        working-directory: nightly
        run: |
          if ! git diff --exit-code -- go.mod '*/go.mod'; then
            echo "::error::The go.mod files at the nightly ref don't require the module versions of this release, see diff above."
            exit 1
          fi

  promote:
    name: Promote nightly artifacts to release
    runs-on: ubuntu-24.04
    needs: prepare
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.prepare.outputs.EFFECTIVE_VERSION }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download release artifacts from nightly run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contrast-release-artifacts
          path: ./release-artifacts
          run-id: ${{ needs.prepare.outputs.nightly_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download darwin CLI from nightly run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contrast-cli-aarch64-darwin
          path: ./darwin-artifacts
          run-id: ${{ needs.prepare.outputs.nightly_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Drop padding LICENSE file
        run: rm ./release-artifacts/LICENSE
      - name: Create release draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3  # zizmor: ignore[superfluous-actions]
        with:
          draft: true
          generate_release_notes: true
          tag_name: ${{ needs.prepare.outputs.EFFECTIVE_VERSION }}
          previous_tag: ${{ needs.prepare.outputs.PREVIOUS_TAG }}
          target_commitish: ${{ needs.prepare.outputs.nightly_ref }}
          fail_on_unmatched_files: true
          files: |
            ./release-artifacts/**
            ./darwin-artifacts/contrast-aarch64-darwin
            ./darwin-artifacts/contrast-cli-aarch64-darwin.cdx.json

  retag-images:
    name: Tag promoted images with the release version
    runs-on: ubuntu-24.04
    needs: [prepare, promote]
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_nix
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cachixToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Download image replacements from nightly run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-replacements
          run-id: ${{ needs.prepare.outputs.nightly_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to ghcr.io Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag promoted digests with the release version
        env:
          VERSION: ${{ needs.prepare.outputs.EFFECTIVE_VERSION }}
          SET: base
        run: |
          set -euo pipefail
          crane=$(nix build --no-link --print-out-paths ".#${SET}.nixpkgs.crane" | head -n1)/bin/crane

          count=$(grep -cE '^[^#].*=' image-replacements.txt || true)
          if (( count == 0 )); then
            echo "::error::No image replacements found in image-replacements.txt."
            exit 1
          fi

          while IFS= read -r replacement; do
            case "${replacement}" in ''|'#'*) continue ;; esac
            pinned="${replacement#*=}"
            echo "Tagging ${pinned} as ${VERSION}"
            "${crane}" tag "${pinned}" "${VERSION}"
          done <image-replacements.txt

  prepare-github-release:
    name: Create backport label and milestone
    # Backport label and milestone track the release branch, which only a minor release creates.
    if: needs.prepare.outputs.KIND == 'minor'
    # Depend on promote so we don't create a milestone for a failed release.
    needs: [prepare, promote]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare_github_release
        with:
          release_branch: ${{ needs.prepare.outputs.RELEASE_BRANCH }}
          next_minor: ${{ needs.prepare.outputs.NEXT_MINOR }}
          github_token: ${{ github.token }}

  prepare-post-release-pr:
    name: Prepare post-release PR to main
    runs-on: ubuntu-24.04
    needs: [prepare, promote]
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare_post_release_pr
        with:
          checkout_main_ref: ${{ inputs.checkout_main_ref }}
          version: ${{ needs.prepare.outputs.EFFECTIVE_VERSION }}
          major_minor: ${{ needs.prepare.outputs.MAJOR_MINOR }}
          major_minor_patch: ${{ needs.prepare.outputs.MAJOR_MINOR_PATCH }}
          without_v: ${{ needs.prepare.outputs.WITHOUT_V }}
          next_minor_pre_without_v: ${{ needs.prepare.outputs.NEXT_MINOR_PRE_WITHOUT_V }}
          pr_branch_suffix: ${{ needs.prepare.outputs.EFFECTIVE_VERSION }}
          kind: ${{ needs.prepare.outputs.KIND }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          nunki_ci_token: ${{ secrets.NUNKI_CI_COMMIT_PUSH_PR }}
          cachix_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          artifacts_run_id: ${{ needs.prepare.outputs.nightly_run_id }}

  publish:
    name: Publish release
    needs: [prepare, promote, retag-images, prepare-github-release, prepare-post-release-pr]
    if: |
      always()
      && needs.prepare.result == 'success'
      && needs.promote.result == 'success'
      && needs.retag-images.result == 'success'
      && needs.prepare-post-release-pr.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.prepare-github-release.result)
    runs-on: ubuntu-24.04
    environment: release-publish
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          # edgelessci's token is required to push to the protected release/* branch.
          token: ${{ secrets.NUNKI_CI_COMMIT_PUSH_PR }}
      - name: Create and push release tag
        env:
          VERSION: ${{ needs.prepare.outputs.EFFECTIVE_VERSION }}
          WITHOUT_V: ${{ needs.prepare.outputs.WITHOUT_V }}
          REF: ${{ needs.prepare.outputs.nightly_ref }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.RELEASE_BRANCH }}
        run: |
          git fetch origin "${REF}"
          git checkout --detach "${REF}"
          # The nightly built the artifacts with version.txt set to the release version, so the tag carries that change
          # to rebuild them as-is.
          current=$(<version.txt)
          if [[ "${current}" != "${WITHOUT_V}" ]]; then
            echo -n "${WITHOUT_V}" > version.txt
            # Fixed dates keep the commit SHA stable, so a rerun pushes the same tags.
            date=$(git show -s --format=%cI HEAD)
            GIT_AUTHOR_DATE="${date}" GIT_COMMITTER_DATE="${date}" \
              git -c user.name=edgelessci -c user.email=edgelessci@users.noreply.github.com \
              commit -m "flake: ${current} -> ${WITHOUT_V}" -- version.txt
          fi
          release_ref=$(git rev-parse HEAD)
          # The release branch takes the release commit as a fast-forward, so stop before tagging if something was
          # merged since the nightly. A rerun finds the branch past the release commit, a new minor finds no branch.
          branch_head=$(git ls-remote origin "refs/heads/${RELEASE_BRANCH}")
          branch_head="${branch_head%%$'\t'*}"
          if [[ -n "${branch_head}" && "${branch_head}" != "${REF}" ]]; then
            git fetch origin "${branch_head}"
            if ! git merge-base --is-ancestor "${release_ref}" "${branch_head}"; then
              echo "::error::${RELEASE_BRANCH} has moved past nightly ref ${REF}. Cut a new nightly."
              exit 1
            fi
          fi
          # The apitypes and sdk Go modules are released together with Contrast, as v0.<minor>.<patch>.
          module_version="v0.${VERSION#v*.}"
          git tag "${VERSION}" "${release_ref}"
          git tag "apitypes/${module_version}" "${release_ref}"
          git tag "sdk/${module_version}" "${release_ref}"
          git push --atomic origin "${VERSION}" "apitypes/${module_version}" "sdk/${module_version}"
      - name: Determine next patch pre-version
        id: next-patch
        env:
          WITHOUT_V: ${{ needs.prepare.outputs.WITHOUT_V }}
        run: echo "value=${WITHOUT_V%.*}.$((${WITHOUT_V##*.} + 1))-pre" | tee -a "$GITHUB_OUTPUT"
      - name: Bump to next patch pre-version
        id: bump
        # This runs the nightly ref's copy of the action, so the bump matches the files on that release branch.
        uses: ./.github/actions/bump_version
        with:
          version: ${{ steps.next-patch.outputs.value }}
          commit: false
      - name: Update release branch
        env:
          COMMIT_MSG: ${{ steps.bump.outputs.commit-msg }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.RELEASE_BRANCH }}
        run: |
          # The branch moves on to the next -pre version, so builds from it never report the released version.
          date=$(git show -s --format=%cI HEAD)
          git add -u -- version.txt go.mod '*/go.mod'
          GIT_AUTHOR_DATE="${date}" GIT_COMMITTER_DATE="${date}" \
            git -c user.name=edgelessci -c user.email=edgelessci@users.noreply.github.com \
            commit -m "${COMMIT_MSG}"
          # release/* requires linear history so this push must be a fast-forward.
          git push origin "HEAD:refs/heads/${RELEASE_BRANCH}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.EFFECTIVE_VERSION }}
        run: |
          gh release edit "${VERSION}" --draft=false --repo "${{ github.repository }}"
      - name: Delete nightly draft release
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.nightly_version }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete "${NIGHTLY_VERSION}" --repo "${GH_REPO}" --yes || true
      - name: Verify release attestation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.EFFECTIVE_VERSION }}
        run: gh release verify "${VERSION}" --repo "${{ github.repository }}"
