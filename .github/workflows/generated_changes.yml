name: commit generated changes
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] consumes a validated patch as data; never runs PR code
    workflows: [static checks]
    types: [completed]
permissions: {}
jobs:
  commit:
    # workflow_run uses this workflow from the default branch, never from the PR.
    if: >-
      github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Check open PR and current head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          number=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/pulls" | jq -r \
            --arg repo "$GH_REPO" --arg sha "$HEAD_SHA" --arg branch "$HEAD_BRANCH" \
            '.[] | select(.state == "open" and .head.repo.full_name == $repo and .head.sha == $sha and .head.ref == $branch) | .number')
          [[ "$number" =~ ^[0-9]+$ ]] || exit 0
          artifact=$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "generated-changes" and .expired == false) | .id')
          [[ "$artifact" =~ ^[0-9]+$ ]] || exit 0
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.number != ''
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.number != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          path: target
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.pr.outputs.number != ''
        with:
          name: generated-changes
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/changes
      - name: Apply generated changes
        if: steps.pr.outputs.number != ''
        uses: ./trusted/.github/actions/apply_generated_patch
        with:
          patch: ${{ runner.temp }}/changes/generated.patch
          working-directory: target
      - name: Commit generated changes
        if: steps.pr.outputs.number != ''
        working-directory: target
        run: |
          git diff --cached --quiet && exit 0
          git -c user.name=edgelessci -c user.email=edgelessci@users.noreply.github.com \
            commit -m "fixup: update generated code"
      - name: Push to unchanged Renovate head
        if: steps.pr.outputs.number != ''
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.NUNKI_CI_COMMIT_PUSH_PR }}
        run: |
          [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]] || exit 0
          [[ "$HEAD_BRANCH" == renovate/* ]] || exit 1
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push --force-with-lease="refs/heads/${HEAD_BRANCH}:${HEAD_SHA}" \
            "https://github.com/${GH_REPO}.git" "HEAD:refs/heads/${HEAD_BRANCH}"
