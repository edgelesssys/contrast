# k3s and v2 drop-in: this machine is shared for development
apiVersion: v1
kind: ConfigMap
metadata:
  name: contrast-e2e-nodeinstaller-config
  namespace: "default"
data:
  containerd-import-dir: var/lib/rancher/k3s/agent/etc/containerd/config.toml.d
  containerd-socket-path: run/k3s/containerd/containerd.sock
  systemd-unit-name: k3s.service
